<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cast demo ballot</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="panel"><h1>Cast your demo ballot</h1><p>Voter eligibility state and ballot choices are stored in separate tables in this demo.</p><form method="post" action="/vote"><input type="hidden" name="token" value="{{token}}">{% for c in candidates %}<label class="choice"><input type="radio" name="candidate" value="{{c}}" required> {{c}}</label>{% endfor %}<button>Submit vote</button></form><p class="notice">Demo only; not for actual elections.</p></main></body></html>
